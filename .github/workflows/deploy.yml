name: Deploy Data2Metrics

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/breackey/apps/Data2Metrics
            git pull origin main
            echo "--- DEPLOY CONTEXT ---"
            pwd
            git rev-parse HEAD
            ls -la
            grep -n "adminRouter.get('/health'" index.js
            grep -n "app.use('/admin', adminRouter)" index.js
            if [ ! -f .env ]; then
              echo "ERROR: /home/breackey/apps/Data2Metrics/.env is missing"
              echo "Create .env with ADMIN_USERNAME, ADMIN_PASSWORD, ADMIN_SESSION_SECRET, NODE_ENV"
              exit 1
            fi
            set -a
            . ./.env
            set +a
            for required_var in ADMIN_USERNAME ADMIN_PASSWORD ADMIN_SESSION_SECRET; do
              eval "value=\${$required_var}"
              if [ -z "$value" ]; then
                echo "ERROR: Missing required env var in .env: $required_var"
                exit 1
              fi
            done
            npm install --include=dev
            npm run build:css
            pm2 startOrReload ecosystem.config.js --only data2metrics --update-env
            sleep 2
            PM2_PID=$(pm2 pid data2metrics)
            echo "PM2 PID: ${PM2_PID}"
            if [ -z "${PM2_PID}" ] || [ "${PM2_PID}" = "0" ]; then
              echo "ERROR: pm2 pid data2metrics returned ${PM2_PID}"
              pm2 ls
              pm2 logs data2metrics --lines 100 --nostream || true
              exit 1
            fi
            echo "--- LOCAL APP CHECKS ---"
            ss -ltnp 'sport = :3000' || true
            EXPECTED_SITE_URL=${SITE_URL:-https://data2metrics.com}
            BUILD_RESPONSE=$(curl -fsS http://127.0.0.1:3000/__build)
            echo "${BUILD_RESPONSE}"
            echo "${BUILD_RESPONSE}" | grep -q "data2metrics-2026-05-23-admin-route-check"
            curl -fsS http://127.0.0.1:3000/admin/health
            READINESS_RESPONSE=$(curl -fsS http://127.0.0.1:3000/__readiness)
            echo "${READINESS_RESPONSE}"
            echo "${READINESS_RESPONSE}" | grep -q '"ok":true'
            echo "${READINESS_RESPONSE}" | grep -q '"hasTailwindCss":true'
            echo "${READINESS_RESPONSE}" | grep -q '"hasOptimizedLogo":true'
            ROBOTS_RESPONSE=$(curl -fsS http://127.0.0.1:3000/robots.txt)
            echo "${ROBOTS_RESPONSE}"
            echo "${ROBOTS_RESPONSE}" | grep -q "Sitemap:"
            SITEMAP_RESPONSE=$(curl -fsS http://127.0.0.1:3000/sitemap.xml)
            echo "${SITEMAP_RESPONSE}" | grep -q "<urlset"
            echo "${SITEMAP_RESPONSE}" | grep -q "${EXPECTED_SITE_URL}"
            HOME_HTML=$(curl -fsS http://127.0.0.1:3000/)
            echo "${HOME_HTML}" | grep -qi "<link rel=\"canonical\" href=\"${EXPECTED_SITE_URL}\""
            echo "${HOME_HTML}" | grep -qi 'application/ld+json'
            COMPASS_HTML=$(curl -fsS http://127.0.0.1:3000/business_compass)
            echo "${COMPASS_HTML}" | grep -qi "<link rel=\"canonical\" href=\"${EXPECTED_SITE_URL}/business_compass\""
            echo "${COMPASS_HTML}" | grep -qi 'application/ld+json'
            BLOG_HTML=$(curl -fsS http://127.0.0.1:3000/blog/why-your-dashboard-isnt-working)
            echo "${BLOG_HTML}" | grep -qi "<link rel=\"canonical\" href=\"${EXPECTED_SITE_URL}/blog/why-your-dashboard-isnt-working\""
            echo "${BLOG_HTML}" | grep -qi 'application/ld+json'
            PROJECT_HTML=$(curl -fsS http://127.0.0.1:3000/project/business_compass)
            echo "${PROJECT_HTML}" | grep -qi "<link rel=\"canonical\" href=\"${EXPECTED_SITE_URL}/project/business_compass\""
            echo "${PROJECT_HTML}" | grep -qi 'application/ld+json'
            CONSULTING_REDIRECT=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 0 http://127.0.0.1:3000/data-analytics-consultant-kenya || true)
            if [ "${CONSULTING_REDIRECT}" != "301" ]; then
              echo "ERROR: /data-analytics-consultant-kenya should redirect with HTTP 301, got ${CONSULTING_REDIRECT}"
              exit 1
            fi
            CSS_BYTES=$(curl -fsS http://127.0.0.1:3000/css/tailwind.css | wc -c)
            echo "Tailwind CSS bytes: ${CSS_BYTES}"
            if [ "${CSS_BYTES}" -lt 5000 ]; then
              echo "ERROR: Tailwind CSS output is unexpectedly small (${CSS_BYTES} bytes)."
              exit 1
            fi
            pm2 save

          
