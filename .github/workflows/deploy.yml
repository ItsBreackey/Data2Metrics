name: Deploy Data2Metrics

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/breackey/apps/Data2Metrics
            git pull origin main
            npm install
            pm2 startOrReload ecosystem.config.js --only data2metrics --update-env
            sleep 2
            curl -fsS http://127.0.0.1:3000/admin/health
            pm2 save

          