{% extends "base.html" %}

{% block content %}

<section id="contact" class="contact">
  <div class="container">
    <h2>Contact Us</h2>
    <p>We'd love to hear from you! Whether you have a question, feedback, or just want to say hello, feel free to reach out.</p>
    {% if messages %}
    {% for message in messages %}
        <div class="alert success" style="padding: 10px; background: #0f0; color: #000; border-radius: 5px; margin-bottom: 15px;">
        {{ message }}
        </div>
    {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'contact' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      
      <button type="submit" class="btn">Send Message</button>
    </form>
  </div>
